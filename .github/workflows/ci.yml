name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: |
          dotnet restore BlueMax.Presentation.Wpf/BlueMax.Presentation.Wpf.csproj
          dotnet restore BlueMax.Domain.Tests/BlueMax.Domain.Tests.csproj

      - name: Build
        run: dotnet build BlueMax.Presentation.Wpf/BlueMax.Presentation.Wpf.csproj -c Release --no-restore

      - name: Test
        run: dotnet test BlueMax.Domain.Tests/BlueMax.Domain.Tests.csproj -c Release --no-restore

      - name: Check hardcoded Arabic literals
        run: powershell -ExecutionPolicy Bypass -File scripts/check-arabic-literals.ps1
